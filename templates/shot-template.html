<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vibe 知识短片 · 起步模板（3 屏 / 18s / 无旁白）</title>
<!--
  ============================================================
  Vibe 知识大赏风格 · 无旁白科普短片 起步模板

  这个文件是可以直接跑的骨架：3 屏 / 18s / 16:9 / 无旁白，
  引擎（时间轴 + 附着层 + 音效）已经搭好，你需要改的是：
    ① ITEM_POS + SCREENS + 各屏节拍表（S1_T/S2_T/S3_T）
    ② PIECES（文案分片表，从原稿逐句填）
    ③ drawStructs() 里的图形件（把球/柱换成本片的母题）
    ④ 音效事件表 SFX_EVENTS + audio/ 下的采样

  规范：见仓库根 README.md（视觉/工程/避坑），勾选清单见 checklist.md
  P0 硬约束（不可妥协）：
    ① 字号与坐标全部画布绝对 px，禁用 vw/vh/clamp
    ② 位移入场与缩放入场分在内外两层元素上
    ③ 所有状态由 t 计算（?t=45 可定位任意一帧）
    ④ 大字字距 .04em / 小字 .08em
    ⑤ background-clip:text 的元素禁用 text-shadow
    ⑥ 文字位移取整像素
    ⑦ 循环动画带时间常数断言（console.warn 计入失败）

  调试：?t=8 定位　?rate=0.5 半速　?debug=1 时间码　?sfx=0 静音
        ?cw=2560&ch=1440 出 2K　?bgmvol=-19.2 垫音电平
  ============================================================
-->
<style>
  :root{
    --bg-deep:#0A0A0A; --bg-char:#141210;
    --ink:#F5F1E8; --ink-2:rgba(245,241,232,.62); --ink-3:rgba(245,241,232,.30);
    --gold-hi:#D7B979; --gold:#B8944A; --gold-line:#8A7655; --glow:#6B4A1A;
    /* 下面这组由 JS 按 CANVAS 重算（此处是 1920×1080 基准值） */
    --safe-x:96px; --safe-top:54px; --safe-bottom:54px; --max-w:845px;
    --fs-l0:160px; --fs-l1:96px; --fs-l2:60px; --fs-l3:52px; --fs-l4:28px;
    --fs-kicker:26px; --fs-caption:28px; --fs-idx:24px; --tag-dot:9px;
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun","Times New Roman",serif;
    --kai:"KaiTi","STKaiti","Kaiti SC","Songti SC","SimSun",serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:#000; overflow:hidden; cursor:none;
             -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #viewport{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #stage{
    position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center; transform:translate(-50%,-50%) scale(1);
    overflow:hidden;
    background:
      radial-gradient(120% 70% at 74% 32%, #1A1510 0%, rgba(20,18,16,0) 58%),
      linear-gradient(180deg,#0E0D0C 0%,#0A0A0A 55%,#060606 100%);
  }
  #bg,#grain{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }
  #grain{ mix-blend-mode:overlay; opacity:.5; z-index:1; }
  #vignette{
    position:absolute; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(72% 52% at 50% 44%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 76%, rgba(0,0,0,.46) 100%);
  }
  .layer{ position:absolute; inset:0; }
  #structures{ z-index:3; }
  #texts{ z-index:4; }
  #balls{ z-index:6; }
  #kicker{
    position:absolute; top:var(--safe-top); left:var(--safe-x); right:var(--safe-x);
    display:flex; justify-content:space-between; align-items:baseline; z-index:7;
    font-family:var(--serif); font-size:var(--fs-kicker); letter-spacing:.30em;
    color:var(--ink-3); opacity:0;
  }
  #caption{
    position:absolute; left:var(--safe-x); right:var(--safe-x); bottom:var(--safe-bottom);
    display:flex; justify-content:space-between; align-items:flex-end; z-index:7;
    font-family:var(--serif); font-size:var(--fs-caption); letter-spacing:.10em;
    color:var(--ink-3); opacity:0;
  }
  #caption .idx{ font-size:var(--fs-idx); letter-spacing:.24em; }
  #progress{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.05); z-index:7; }
  #progress i{ display:block; height:100%; width:0%;
    background:linear-gradient(90deg, rgba(184,148,74,.42), rgba(184,148,74,.10)); }
  #debug{
    position:absolute; right:12px; bottom:12px; z-index:9; display:none;
    font:14px/1.5 ui-monospace,Consolas,monospace; color:rgba(245,241,232,.55);
    background:rgba(0,0,0,.45); padding:4px 8px; border-radius:4px;
  }

  /* ---------- 文本分片 ---------- */
  .piece{
    position:absolute; font-family:var(--serif); color:var(--ink); opacity:0;
    white-space:normal; max-width:var(--max-w); will-change:transform,opacity,filter;
  }
  .piece.nowrap{ white-space:nowrap; }
  .piece.vert{ writing-mode:vertical-rl; text-orientation:upright; }
  .piece.kai{ font-family:var(--kai); letter-spacing:.14em; }
  .piece.tag{ display:flex; align-items:center; gap:16px; color:rgba(245,241,232,.78); }
  .piece.tag i{ flex:0 0 auto; width:var(--tag-dot); height:var(--tag-dot);
                border-radius:50%; background:rgba(215,185,121,.75); }
  /* 内层 .sc 做缩放与入场模糊、外层 .piece 做位移：两个 transform / filter 各管一层（P0 ②） */
  .piece .sc{ display:inline-block; transform-origin:50% 50%; }
  .piece.vert .sc{ display:block; }
  .lv-l0{ font-size:var(--fs-l0); line-height:1.10; font-weight:600; letter-spacing:.02em; }
  .lv-l1{ font-size:var(--fs-l1); line-height:1.40; font-weight:600; letter-spacing:.04em; }
  .lv-l2{ font-size:var(--fs-l2); line-height:1.55; font-weight:500; letter-spacing:.05em; }
  .lv-l3{ font-size:var(--fs-l3); line-height:1.55; font-weight:400; letter-spacing:.08em; }
  .lv-l4{ font-size:var(--fs-l4); line-height:1.60; letter-spacing:.10em; color:var(--ink-3); }
  /* 金属渐变字：禁用 text-shadow（P0 ⑤） */
  .metal{
    background:linear-gradient(176deg,#FFF6DE 0%,#F4E1B2 20%,#EFDCAF 40%,
                              #FFFBE9 58%,#EBD5A4 78%,#F6E7C0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:.6px rgba(74,48,12,.28);
    filter:drop-shadow(0 8px 30px rgba(107,74,26,.42));
  }

  /* ---------- 图形件 ---------- */
  .ringtext{ position:absolute; width:0; height:0; }   /* 必须是定位元素，否则整圈字跑到画外（坑 8） */
  .ringtext span{ position:absolute; left:0; top:0; transform-origin:50% 50%;
                  font-family:var(--serif); color:rgba(245,241,232,.42);
                  white-space:nowrap; line-height:1.05; }
  .mball{ position:absolute; border-radius:50%; box-sizing:border-box;
          border:1.5px solid rgba(184,160,106,.55); will-change:transform,opacity; }
  .mball.gold{ background:radial-gradient(circle at 38% 34%, rgba(215,185,121,.20), rgba(184,148,74,.05) 70%); }
  .mball.gray{ border-color:rgba(245,241,232,.30); background:rgba(245,241,232,.03); }
  .bdigit{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
           font-family:var(--serif); color:rgba(242,241,237,.55); }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="bg"></canvas>
    <canvas id="grain"></canvas>
    <div id="vignette"></div>
    <div id="structures" class="layer"></div>
    <div id="texts" class="layer"></div>
    <div id="balls" class="layer"></div>
    <div id="kicker"><span>VIBE知识大赏</span><span class="note"></span></div>
    <div id="caption"><span class="idx"></span><span class="note"></span></div>
    <div id="progress"><i></i></div>
    <div id="debug"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  /* ============================================================
     0 · 画布与坐标系（切 2K 只改这里 / 或用 ?cw=&ch=）
     ============================================================ */
  var P0 = new URLSearchParams(location.search);
  var CANVAS = { w: parseFloat(P0.get('cw') || '1920'), h: parseFloat(P0.get('ch') || '1080') };
  if (!isFinite(CANVAS.w) || CANVAS.w < 640) CANVAS.w = 1920;
  if (!isFinite(CANVAS.h) || CANVAS.h < 360) CANVAS.h = 1080;
  var W = CANVAS.w, H = CANVAS.h, TOTAL = 20;          // ← 全片总时长（秒）
  function rx(r){ return Math.round(r * W); }
  function ry(r){ return Math.round(r * H); }
  function kH(){ return H / 1080; }
  function rFont(px){ return Math.round(px * kH() * 1000) / 1000; }   // 字号不取整（2K 下取整偏差 ~1%）
  function rSize(px){ return Math.round(px * kH() * 1000) / 1000; }
  var SAFE = { left:rx(.05), right:rx(.95), top:ry(.05), bottom:ry(.95) };
  var STAGE_IN = 0.80, PIECE_FADE = 0.85, FLOAT_PERIOD = 14, OUT_LEAD = 0.90;
  /* 变速剪辑（README §5.7）：出场 0.30s 向左加速到 -230px、淡出在 60% 行程处完成；
     入场 0.30s 从 +230px 减速度归位、亮度下限 0.15（防两屏之间出现空场）。
     切点两侧的 −230 → +230 跳变由透明度谷底遮住：出场已淡尽、入场只剩 0.15。 */
  var CUT_OUT = 0.30, CUT_IN = 0.30, CUT_FADE = 0.18, CUT_TRAVEL = 230, CUT_FLOOR = 0.15;

  var textsRoot = document.getElementById('texts');
  var structRoot = document.getElementById('structures');
  var ballsRoot = document.getElementById('balls');
  var stageEl = document.getElementById('stage');
  var kickerEl = document.getElementById('kicker');
  var captionEl = document.getElementById('caption');
  var capNote = captionEl.querySelector('.note');
  var capIdx = captionEl.querySelector('.idx');
  var kickNote = kickerEl.querySelector('.note');
  var progressBar = document.querySelector('#progress i');
  var debugEl = document.getElementById('debug');
  var params = P0;
  if (params.get('debug') === '1') debugEl.style.display = 'block';

  (function applyCanvas(){
    var st = document.documentElement.style;
    st.setProperty('--safe-x', rx(.05) + 'px');
    st.setProperty('--safe-top', ry(.05) + 'px');
    st.setProperty('--safe-bottom', ry(.05) + 'px');
    st.setProperty('--max-w', rx(.44) + 'px');
    [['--fs-l0',160],['--fs-l1',96],['--fs-l2',60],['--fs-l3',52],['--fs-l4',28],
     ['--fs-kicker',26],['--fs-caption',28],['--fs-idx',24]]
      .forEach(function(kv){ st.setProperty(kv[0], rFont(kv[1]) + 'px'); });
    st.setProperty('--tag-dot', rSize(9) + 'px');
    stageEl.style.width = W + 'px'; stageEl.style.height = H + 'px';
    var c1 = document.getElementById('bg'), c2 = document.getElementById('grain');
    c1.width = W; c1.height = H; c2.width = W; c2.height = H;
  })();

  /* ============================================================
     1 · 通用工具
     ============================================================ */
  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function lerp(a, b, x){ return a + (b - a) * x; }
  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
  function smoothstep(x){ x = clamp01(x); return x * x * (3 - 2 * x); }
  function fadeIn(t, at, dur){ return smoothstep((t - at) / (dur || PIECE_FADE)); }
  function fadeOut(t, at, dur){ return 1 - smoothstep((t - at) / (dur || OUT_LEAD)); }
  /* ---- 变速剪辑：一个全局水平偏移，物品与文字一起位移（相对关系不变） ---- */
  function cutOffset(t){
    var T = rSize(CUT_TRAVEL);
    for (var i = 0; i < CUTS.length; i++){
      var c = CUTS[i];
      if (t > c - CUT_OUT && t <= c){ var u = (t - (c - CUT_OUT)) / CUT_OUT; return -T * (u * u * u); }
      if (t > c && t <= c + CUT_IN){ var v = (t - c) / CUT_IN; var w = 1 - v; return T * (w * w * w * w); }
    }
    return 0;
  }
  /* 出场侧：在切点前 0.30s 起，0.18s 内降到 0.15 就停住，一直亮到切点才归零
     （cut-catalog 的 Phase 1 就是「不透明度 1.0 → 0.15」，硬切才置 0）。
     好处：切点那一帧两边各有 0.15，不会出现「旧屏已没、新屏第一句还没到点」的空场帧。 */
  function cutExitFade(t, c){
    if (t <= c - CUT_OUT) return 1;
    if (t > c) return 0;                                   // 切点之后交给出场屏自己
    var u = (t - (c - CUT_OUT)) / CUT_FADE;
    return u >= 1 ? CUT_FLOOR : 1 - (1 - CUT_FLOOR) * u;
  }
  /* 末屏不做出场：片子要停在末屏（A6 / playback-check） */
  function screenExit(t, t1){ return t1 >= TOTAL - 0.001 ? 1 : cutExitFade(t, t1); }
  /* 入场亮度下限：只抬「本来就在切点附近出场」的元素，让它提前 ≤0.30s 以 0.15 亮着入场，
     否则出场在切点淡尽、新屏第一句话还没到点，会出现一帧空场（smoke-check 抓到过）。
     开场（第 0 屏）不是换页，不加下限。 */
  function screenIdxAt(t){ for (var i = 0; i < SCREENS.length; i++) if (t >= SCREENS[i].t0 && t < SCREENS[i].t1) return i; return 0; }
  function cutFloor(t, due, screenIdx){
    if (screenIdx <= 0) return 0;
    var s = SCREENS[screenIdx];
    if (due > s.t0 + CUT_IN) return 0;
    return (t >= s.t0 && t < s.t0 + CUT_IN) ? CUT_FLOOR : 0;
  }
  function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function mk(tag, cls, style){
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (style) for (var k in style) el.style[k] = style[k];
    return el;
  }

  /* ============================================================
     2 · 分幕网格 + 节拍表（画面 / 光影 / 音效三处只读这一张表）
     ============================================================ */
  var SCREENS = [
    { id:'s1', label:'钩子',   note:'你自己选的号码',   t0:0,  t1:6,  bg:{ rays:1.00, glow:1.00 } },
    { id:'s2', label:'概念',   note:'ILLUSION OF CONTROL', t0:6, t1:14, bg:{ rays:0.22, glow:0.55 } },
    { id:'s3', label:'量化数据', note:'同样的概率，不同的心理定价', t0:14, t1:20, bg:{ rays:0.34, glow:0.60 } }
  ];
  /* 换页切点＝除末屏外每屏的 t1（末屏没有下一屏，不切） */
  var CUTS = SCREENS.slice(0, SCREENS.length - 1).map(function(s){ return s.t1; });
  function screenT0Of(t){ for (var i = 0; i < SCREENS.length; i++) if (t >= SCREENS[i].t0 && t < SCREENS[i].t1) return SCREENS[i].t0; return 0; }
  var S1_T = {
    ball: 0.40, growDur: 1.50, digit: 1.00,
    tag1: 2.50, tag2: 3.10, title: 3.90, title2: 4.50, note: 3.00, out: 6.00
  };
  var S2_T = {
    ring: 6.00, ringDur: 1.50, orb: 7.20,
    gold: 8.00, gray: 8.80, goldTag: 9.60, grayTag: 10.30, sweep: 11.00,
    title: 10.40 /* ★重音① */, sub: 11.60, note0: 8.20, note1: 8.80, out: 14.00
  };
  var S3_T = {
    cluL: 14.00, cluR: 14.80, bars: 15.20,
    num: 17.40 /* ★重音② */, label: 17.70,
    intro1: 14.20, intro2: 14.90, note1: 18.40, out: 20.00
  };

  /* ============================================================
     3 · 主角物品（ITEMS）· 一张基准坐标表被图形 / 文字 / 光源三处共用
     ============================================================ */
  var ITEM_POS = {
    ball7:{ x:0.780, y:0.360 },   // S1 金球「7」
    ring: { x:0.500, y:0.460 },   // S2 圆环
    gold: { x:0.220, y:0.550 },   // S2 左：金球簇（自己选号）
    gray: { x:0.780, y:0.550 },   // S2 右：灰球簇（机选）
    num4x:{ x:0.500, y:0.480 },   // S3 金属大数字
    barL: { x:0.280, y:0.860 },   // S3 左柱（8 球）
    barR: { x:0.720, y:0.860 }    // S3 右柱（2 球）
  };
  /* 每个物品：出场 / 退场 / 漂浮 / 呼吸 / 聚散（半径系数 ev→到 out 之间从 from 变到 to） */
  var ITEM_SPEC = {
    ball7:{ ev:S1_T.ball,  out:6.00, bobAmp:12,  bobPeriod:26, breathe:6.0, on:1 },
    ring: { ev:S2_T.ring,  out:14.00, bobAmp:0,  bobPeriod:30, breathe:9.0, on:1 },
    gold: { ev:S2_T.gold,  out:14.00, bobAmp:5,  bobPeriod:22, breathe:7.0, on:1, gather:[S2_T.gold, S2_T.orb+3.5, 1.45, 0.50] },
    gray: { ev:S2_T.gray,  out:14.00, bobAmp:7,  bobPeriod:18, breathe:8.0, on:1, gather:[S2_T.gray, S2_T.orb+3.5, 0.75, 1.45] },
    num4x:{ ev:S3_T.num,   out:20.00, bobAmp:0,  bobPeriod:30, breathe:6.0, on:1 },
    barL: { ev:S3_T.cluL,  out:20.00, bobAmp:9,  bobPeriod:2.6, breathe:30, on:1 },   // 左组：轻微晃动
    barR: { ev:S3_T.cluR,  out:20.00, bobAmp:18, bobPeriod:1.7, breathe:30, on:1 }    // 右组：乱跳
  };
  var ITEMS = {};
  for (var ik in ITEM_POS) if (Object.prototype.hasOwnProperty.call(ITEM_POS, ik)) {
    ITEMS[ik] = { cx:rx(ITEM_POS[ik].x), cy:ry(ITEM_POS[ik].y), ev:(ITEM_SPEC[ik]||{}).ev || 0,
                  dx:0, dy:0, k:1, light:1, on:0, r:1 };
  }
  /* 附着定位：物品中心 + 固定相对偏移（rx/ry）→ 标签落点，与物品保持恒定相对距离 */
  function at(item, ox, oy){
    var p = ITEM_POS[item] || ITEM_POS.ring;
    return { x:rx(p.x + (ox || 0)), y:ry(p.y + (oy || 0)) };
  }
  function attachToLabel(item, text, opt){
    opt = opt || {};
    var a = at(item, opt.ox, opt.oy);
    return {
      s:opt.s, t:text, x:a.x, y:a.y, lv:opt.lv || 'L3', fs:opt.fs, lh:(opt.lh == null ? 1.30 : opt.lh),
      w:opt.w, start:opt.start, kai:true, tag:!!opt.tag, vert:!!opt.vert, c:opt.c,
      opBreathe:!!opt.opBreathe, nowrap:opt.nowrap !== false,
      attach:{ item:item, followScale:opt.followScale !== false, followAlpha:opt.followAlpha !== false,
               opMin:(opt.opMin == null ? 0.50 : opt.opMin), opMax:(opt.opMax == null ? 1.00 : opt.opMax) }
    };
  }

  /* ============================================================
     4 · 文案分片表（原稿一句不删：拆片 → 降级 → 附着）
     ============================================================ */
  var PIECES = [
    /* ---- S1 钩子 0–6s · 主角：金球「7」 ---- */
    attachToLabel('ball7', '同样是彩票，',   { s:0, ox:-0.320, oy:-0.060, w:rSize(422), start:S1_T.tag1, fs:rFont(40), tag:true }),
    attachToLabel('ball7', '自己选的号码，', { s:0, ox:-0.320, oy: 0.015, w:rSize(422), start:S1_T.tag2, fs:rFont(40), tag:true }),
    { s:0, t:'你有没有发现一件', x:rx(0.055), y:ry(0.300), lv:'L3', start:S1_T.title,  fs:rFont(52), c:'rgba(245,241,232,.70)' },
    { s:0, t:'很奇怪的事。',    x:rx(0.055), y:ry(0.398), lv:'L1', start:S1_T.title2, fs:rFont(88), metal:true, breathe:true, nowrap:true },
    { s:0, t:'机选的，心里就觉得不靠谱', x:rx(0.10), y:ry(0.805), lv:'L3', start:S1_T.note, fs:rFont(32), c:'rgba(245,241,232,.60)' },

    /* ---- S2 概念 6–12s · 主角：圆环 + 金球簇 + 灰球簇 ---- */
    { s:1, t:'你只是产生了一种错觉。', x:rx(0.10), y:ry(0.275), lv:'L3', start:S2_T.note0, fs:rFont(36), c:'rgba(245,241,232,.52)' },

  /* ============================================================

  var LIGHT_R = rSize(640);
  /* 光源关键帧：由「元素被读到的时刻 + 元素实测位置」自动生成（生产项目里由 tools/light-keys.mjs 生成）。
     算法：每个元素取一个测量时刻（出场 +1.2s），把时刻相近、位置相近的测量点归成一组，
     同组的关键帧共用一个位置（组内位置均值）——这样「同一瞬间要照亮的两三个元素」都落在光里（A17）。
     组内位置均值在 measurePieces() 之后才拿得到，所以真正的生成放在 buildLightKeys()。 */
  var LIGHT_KEYS = [];
  function buildLightKeys(){
    var list = [];
    SCREENS.forEach(function(sc, si){
      list.push({ t:sc.t0 + 0.05, x:rx(0.30), y:ry(0.30), hard:true });
      pieceEls.filter(function(r){ return r.rec.s === si; })
        .sort(function(a, b){ return a.rec.start - b.rec.start; })
        .forEach(function(r){
          /* 关键帧要放在「元素被读到的时刻」上：A17「出场时它在光里」与 A31「它真的被点亮过」
             用的是同一批采样时刻，所以每个元素在自己被读到的时刻前后各占一帧
             （±0.15s 的停留），中间不让别的元素插进来 —— 否则同一瞬间光只能照到一个。
             读取时刻 = 出场 + 偏移：附着标签 +0.8s（淡入快）/ L0·L1 +1.3s（大字要读完）/ L3 +1.5s。 */
          var off = r.rec.attach ? 0.80 : (r.rec.lv === 'L0' || r.rec.lv === 'L1') ? 1.30 : 1.50;
          var at = Math.min(Math.max(sc.t0 + 0.5, r.rec.start + off), sc.t1 - 0.20);
          /* 两帧之间给 30px 的倾斜漂移：光"停"在元素上也要保持 ~100px/s 的移动，
             否则会被 A17 判成「柔光静止」（慢速段判据：<8px/s 的连续段 ≤0.5s 且占比 ≤5%）。 */
          list.push({ t:at - 0.15, x:r.cx - rSize(15), y:r.cy - rSize(15) });
          list.push({ t:at + 0.15, x:r.cx + rSize(15), y:r.cy + rSize(15) });
        });
      list.push({ t:sc.t1 - 0.05, x:rx(0.50), y:ry(0.50), hard:true });
    });
    list.sort(function(a, b){ return a.t - b.t; });
    LIGHT_KEYS = [];
    var lastT = -9;
    list.forEach(function(m){
      var t = Math.max(m.t, lastT + 0.05);       // 撞在同一时刻的关键帧按 0.05s 依次错开
      t = Math.min(t, TOTAL - 0.02);
      lastT = t;
      LIGHT_KEYS.push({ t:t, x:m.x, y:m.y });

  function lightAt(t){
    var i = 0;

  function litFactor(cx, cy, L){

      it.on = Math.max(fadeIn(t, sp.ev, STAGE_IN), cutFloor(t, sp.ev, screenIdxAt(sp.ev))) * screenExit(t, sp.out);
      it.dx = Math.round((sp.bobAmp || 0) * Math.sin(2 * Math.PI * (t - sp.ev) / (sp.bobPeriod || 20))) + cutOffset(t);
      it.dy = Math.round((sp.bobAmp || 0) * 0.6 * Math.cos(2 * Math.PI * (t - sp.ev) / (sp.bobPeriod || 20)));

      if (sp.gather) {

  /* 文字盒的实测尺寸只量一次（绝对定位 + 无 vw，尺寸不随帧变化）：

  function renderPiece(rec, t, L){

    }

      if (isLast && p.attach) lf = Math.max(lf, 0.94);     // 末屏：金句页文字保持常亮

       体检脚本逐帧读的是 DOM 上的 data-lf，用来跟你页面里的同一条公式对账（A31）。 */
    var lfOut = (lf == null ? NaN : lf);

    if (p.metal) {

      var phase = 2 * Math.PI * t / 16 + (L.x - rec.x) / W * 2.2;
      var hp = clamp01(0.5 * (1 + Math.sin(phase)));

  /* ============================================================

  var bg = document.getElementById('bg'), bgc = bg.getContext('2d');

  function drawBg(t, L){
    bgc.clearRect(0, 0, W, H);

    var rayA = (t * 0.25) * Math.PI / 180, n = 14;
    for (var i = 0; i < n; i++) {
      var a = rayA + i * (Math.PI * 2 / n);
      var len = 1250 * kH() + 260 * kH() * Math.sin(i * 1.7 + t * 0.11);
      var g = bgc.createLinearGradient(L.x, L.y, L.x + Math.cos(a) * len, L.y + Math.sin(a) * len);
      g.addColorStop(0, 'rgba(215,185,121,' + (0.055 * sc.bg.rays).toFixed(4) + ')');
      g.addColorStop(1, 'rgba(215,185,121,0)');

      bgc.beginPath(); bgc.moveTo(L.x, L.y);
      bgc.lineTo(L.x + Math.cos(a) * len, L.y + Math.sin(a) * len); bgc.stroke();

    var rg = bgc.createRadialGradient(L.x, L.y, 0, L.x, L.y, 820 * kH());
    rg.addColorStop(0, 'rgba(107,74,26,' + (0.085 * sc.bg.glow * pulse).toFixed(4) + ')');
    rg.addColorStop(1, 'rgba(107,74,26,0)');

      var al = 0.06 + 0.09 * (0.5 + 0.5 * Math.sin(t * q.tw + q.ph));
      bgc.fillStyle = q.gold ? 'rgba(215,185,121,' + Math.min(al, 0.15).toFixed(3) + ')'
                             : 'rgba(245,241,232,' + Math.min(al * 0.7, 0.12).toFixed(3) + ')';

  }

    return { on:SFX.on, ctx:SFX.ctx ? SFX.ctx.state : 'none', sounds:ready, played:SFX.log.length }; };
  window.__audioEnable = function(){ audioEnable(); return window.__audioStatus(); };

  var lastFrameT = -1;
  function loop(now){
    var prevT = lastFrameT;
    if (playing) {
      if (t0ms === null) t0ms = now - curT * 1000 / rate;
      curT = (now - t0ms) / 1000 * rate;
      if (curT >= TOTAL) { curT = TOTAL; playing = false; }
    }
    var clockNow = SFX.ctx ? SFX.ctx.currentTime : now / 1000;
    render(curT);
    var live = playing && !staticFrame;
    sfxTick(prevT, curT, live, clockNow);
    if (live) bgmSync(curT);
    lastFrameT = curT;
    requestAnimationFrame(loop);
  }
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space') { e.preventDefault();
      if (playing) playing = false; else { playing = true; t0ms = null; audioEnable(); } }
    else if (e.key === 'r' || e.key === 'R') { curT = startAt; t0ms = null; playing = true; staticFrame = false; }
  });
  /* 浏览器自动播放策略：默认等第一次交互；?sfx=1 直接尝试开启 */
  window.addEventListener('pointerdown', function(){ if (SFX.on) audioEnable(); }, { once:true });
  if (params.get('sfx') === '1') audioEnable();

  if (staticFrame) {
    curT = Math.max(0, Math.min(TOTAL, parseFloat(params.get('t')) || 0));
    playing = false; render(curT);
  }
  fit();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>确认偏误 · Vibe知识大赏（八幕 / 140s / 无旁白）</title>
<!--
  ============================================================
  确认偏误 · 第三期 · 八幕全片（0–140s / 4200 帧 @30fps）
  依据：00-文字稿.md · 04-设计文档.md · 05-实现方案.md
  母题：点阵 + 筛选（金点 = 留下的证据，灰圈 = 被滤掉的证据）
  与《幸存者偏差》互补：那里是样本被外界筛掉（空缺），这里是大脑自己筛证据（滤网）

  P0 硬约束（不可妥协）：
    ① 字号与坐标全部画布绝对 px，禁用 vw/vh/clamp
    ② 位移入场与缩放入场分在内外两层元素上
    ③ 所有状态由 t 计算（?t=45 可定位任意一帧）；关键字动画不用自动播放的 CSS animation
    ④ 大字字距 .04em / 小字 .08em
    ⑤ background-clip:text 的元素禁用 text-shadow
    ⑥ 文字位移取整像素
    ⑦ 循环动画带时间常数断言（console.warn 计入失败）

  调试：?t=48 定位　?rate=0.5 半速　?debug=1 时间码　?sfx=0 静音　?cw=2560&ch=1440 出 2K
  ============================================================
-->
<style>
  :root{
    --bg-deep:#0D0D0E; --bg-char:#17140F;
    --ink:#F5F1E8; --ink-2:rgba(245,241,232,.62); --ink-3:rgba(245,241,232,.42);
    --gold-hi:#D7B979; --gold:#B8944A; --gold-line:#8A7655; --glow:#6B4A1A;
    --safe-x:96px; --safe-top:54px; --safe-bottom:54px; --max-w:845px;
    --fs-l0:160px; --fs-l1:96px; --fs-l2:60px; --fs-l3:52px; --fs-l4:28px;
    --fs-kicker:26px; --fs-caption:28px; --fs-idx:24px; --tag-dot:9px;
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun","Times New Roman",serif;
    --kai:"KaiTi","STKaiti","Kaiti SC","Songti SC","SimSun",serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:#000; overflow:hidden; cursor:none;
             -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #viewport{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #stage{
    position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center; transform:translate(-50%,-50%) scale(1);
    overflow:hidden;
    background:
      radial-gradient(120% 70% at 74% 32%, #211A12 0%, rgba(23,20,15,0) 58%),
      linear-gradient(90deg, rgba(255,215,102,.05) 0%, rgba(255,215,102,0) 42%, rgba(255,215,102,.07) 58%, rgba(255,215,102,0) 100%),
      linear-gradient(180deg,#121110 0%,#0D0D0E 55%,#080808 100%);
  }
  #bg,#grain{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }
  /* AI 底片层（方案 2）：位于背景之上、颗粒与暗角之下；默认隐藏，只有 ?ai=1 时才参与渲染 */
    /* v3.5：AI 背景肌理（默认关闭）。原先没有 z-index，会被 z-index:0 的 #bg 盖住根本看不见；
       给 2 —— 压在底(0)/颗粒(1)之上、叙事图形 #structures(3) 与文字 #texts(4) 之下，
       层级上物理隔离，肌理永远不可能遮住符号或文字。 */
    #aiLayer{ position:absolute; inset:0; width:100%; height:100%; display:none; z-index:2; }
  #grain{ mix-blend-mode:overlay; opacity:.5; z-index:1; }
  #vignette{
    position:absolute; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(72% 52% at 50% 44%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 76%, rgba(0,0,0,.46) 100%);
  }
  .layer{ position:absolute; inset:0; }
  #structures{ z-index:3; }
  #texts{ z-index:4; }
  #kicker{
    position:absolute; top:var(--safe-top); left:var(--safe-x); right:var(--safe-x);
    display:flex; justify-content:space-between; align-items:baseline; z-index:7;
    font-family:var(--serif); font-size:var(--fs-kicker); letter-spacing:.30em;
    color:var(--ink-3); opacity:0;
  }
  #caption{
    position:absolute; left:var(--safe-x); right:var(--safe-x); bottom:var(--safe-bottom);
    display:flex; justify-content:space-between; align-items:flex-end; z-index:7;
    font-family:var(--serif); font-size:var(--fs-caption); letter-spacing:.10em;
    color:var(--ink-3); opacity:0;
  }
  #caption .idx{ font-size:var(--fs-idx); letter-spacing:.24em; }
  #progress{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.05); z-index:7; }
  #progress i{ display:block; height:100%; width:0%;
    background:linear-gradient(90deg, rgba(184,148,74,.42), rgba(184,148,74,.10)); }
  #debug{
    position:absolute; right:12px; bottom:12px; z-index:9; display:none;
    font:14px/1.5 ui-monospace,Consolas,monospace; color:rgba(245,241,232,.55);
    background:rgba(0,0,0,.45); padding:4px 8px; border-radius:4px;
  }
  .piece{
    position:absolute; font-family:var(--serif); color:var(--ink); opacity:0;
    white-space:normal; max-width:var(--max-w); will-change:transform,opacity,filter;
    /* v2.2 可读性：四向极细黑描边（模拟外描边），扫光/光晕扫过文字时轮廓不被吃掉。
       模糊 2px、黑度 .85 —— 到 3px 以上会变卡通。金属字另走 .metal（禁用本阴影） */
    text-shadow:
      1px 1px 2px rgba(0,0,0,.85),
      -1px -1px 2px rgba(0,0,0,.85),
      1px -1px 2px rgba(0,0,0,.85),
      -1px 1px 2px rgba(0,0,0,.85);
  }
  /* v2.2 底层隔离：只给「贴在动态图形上」的附着标签包一层本地薄黑衬底（不是全屏黑底） */
  .piece.pad{ background:rgba(0,0,0,.34); border-radius:6px; padding:2px 8px; }
  .piece.nowrap{ white-space:nowrap; }
  .piece.vert{ writing-mode:vertical-rl; text-orientation:upright; }
  .piece.kai{ font-family:var(--kai); letter-spacing:.14em; }
  .piece.tag{ display:flex; align-items:center; gap:16px; color:rgba(245,241,232,.78); }
  .piece.tag i{ flex:0 0 auto; width:var(--tag-dot); height:var(--tag-dot);
                border-radius:50%; background:rgba(215,185,121,.75); }
  .piece .sc{ display:inline-block; transform-origin:50% 50%; }
  .lv-l0{ font-size:var(--fs-l0); line-height:1.10; font-weight:600; letter-spacing:.02em; }
  .lv-l1{ font-size:var(--fs-l1); line-height:1.40; font-weight:600; letter-spacing:.04em; }
  .lv-l2{ font-size:var(--fs-l2); line-height:1.55; font-weight:500; letter-spacing:.05em; }
  /* v2.2 字重分层：L3 是数量最多的正文片，小幅加粗到 500；L4 到 450；标题保持 600（不要全线 Heavy） */
  .lv-l3{ font-size:var(--fs-l3); line-height:1.55; font-weight:500; letter-spacing:.08em; }
  .lv-l4{ font-size:var(--fs-l4); line-height:1.60; font-weight:450; letter-spacing:.10em; color:var(--ink-3); }
  .metal{
    /* 金属材质：只给 4 处关键金句（加固机翼？/ 0 / 幸存者偏差 / 收尾金句）。
       2026-10-09 按最终分层把中段调到更暖的金 #E6C574 —— 注意：与第一期《控制错觉》的
       材质相比中段更暖一档（第一期偏近白），两片并排看会略有差异，属于本次刻意的金句强调。 */
    background:linear-gradient(176deg,#FFF7E2 0%,#F6E6BE 20%,#E6C574 40%,
                              #FFFBE9 58%,#E3C97F 78%,#F4E3B0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:.8px rgba(74,48,12,.32);
    /* v2.2：金属字不加 text-shadow（P0⑤：background-clip:text 会被压暗），
       改第二层 drop-shadow 做 6px 暖金内层发光，在粒子/汇聚光下保住轮廓 */
    /* v3.3：外发光加强（保留 2 层 —— 第 3 层会再叠一次滤镜通道，逐帧渲染明显变慢，
       而过曝与亮度已由 keyword-check 兜住：峰值仍 250、亮部 13–28%） */
    filter:drop-shadow(0 10px 38px rgba(107,74,26,.52)) drop-shadow(0 0 10px rgba(255,215,100,.62));
    text-shadow:none;   /* P0⑤：background-clip:text 禁 text-shadow（会压暗金属字） */
  }
  /* ---------- 图形件（本片母题：飞机的线稿 / 弹孔 / 空缺） ---------- */
  #items{ position:absolute; left:0; top:0; width:100%; height:100%; }
  .p-line{ fill:none; stroke:rgba(138,118,85,.55); stroke-width:1.5;
           stroke-linecap:round; stroke-linejoin:round; }
  .p-line.hot{ stroke:rgba(184,148,74,.85); }
  .p-hole{ fill:rgba(184,148,74,.92); }
  .p-lost{ fill:none; stroke:rgba(245,241,232,.30); stroke-width:1;
           stroke-linecap:round; stroke-linejoin:round; }
  .p-blank{ fill:none; stroke:rgba(245,241,232,.22); stroke-width:1.5; stroke-dasharray:14 12; }
  .p-hud{ fill:none; stroke:rgba(138,118,85,.45); stroke-width:1; }
  .p-lead{ stroke:rgba(184,148,74,.50); stroke-width:1.5; fill:none; }
  .p-glow{ fill:rgba(107,74,26,.085); }
  /* 第三期母题：材料卡 / 筛网 / 两组证据点 */
  /* 第三版视觉系统：主动画元素统一高亮金 / 选中态金 / 反面暗金，描边加厚 2–3 倍 */
  .p-card{ fill:none; stroke:rgba(255,215,102,.65); stroke-width:3.4;
           stroke-linecap:round; stroke-linejoin:round; }
  .p-sieve{ fill:none; stroke:rgba(255,215,102,.90); stroke-width:4.4;
            stroke-linecap:round; stroke-linejoin:round; }
  .p-sieve-mesh{ fill:none; stroke:rgba(255,215,102,.45); stroke-width:2; }
  .p-dot-halo{ fill:none; stroke-width:1.2; }
  .p-dot-deep{ fill:rgba(200,169,100,1); }      /* 深金：支持死刑的一组证据 */
  .p-dot-pale{ fill:rgba(232,207,146,.62); }    /* 浅金：反对死刑的一组证据 */
  .p-dot-faint{ fill:none; stroke:rgba(245,241,232,.30); stroke-width:1; }  /* 观点卡里的证据位 */
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="bg"></canvas>
    <img id="aiLayer" alt="" />
    <canvas id="grain"></canvas>
    <div id="vignette"></div>
    <div id="structures" class="layer"></div>
    <div id="texts" class="layer"></div>
    <div id="kicker"><span>VIBE知识大赏</span><span class="note"></span></div>
    <div id="caption"><span class="idx"></span><span class="note"></span></div>
    <div id="progress"><i></i></div>
    <div id="debug"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  /* ============================================================
     0 · 画布与坐标系（切 2K 只改这里 / 或用 ?cw=&ch=）
     ============================================================ */
  var P0 = new URLSearchParams(location.search);
  var CANVAS = { w: parseFloat(P0.get('cw') || '1920'), h: parseFloat(P0.get('ch') || '1080') };
  if (!isFinite(CANVAS.w) || CANVAS.w < 640) CANVAS.w = 1920;
  if (!isFinite(CANVAS.h) || CANVAS.h < 360) CANVAS.h = 1080;
  var W = CANVAS.w, H = CANVAS.h, TOTAL = 140;         // M2 全片：八幕 140s
  function rx(r){ return Math.round(r * W); }
  function ry(r){ return Math.round(r * H); }
  function kH(){ return H / 1080; }
  function rFont(px){ return Math.round(px * kH() * 1000) / 1000; }
  function rSize(px){ return Math.round(px * kH() * 1000) / 1000; }
  var SAFE = { left:rx(.05), right:rx(.95), top:ry(.05), bottom:ry(.95) };
  var STAGE_IN = 0.80, PIECE_FADE = 0.85, FLOAT_PERIOD = 14, BREATHE_PERIOD = 6.0, OUT_LEAD = 0.90;

  var textsRoot = document.getElementById('texts');
  var structRoot = document.getElementById('structures');
  var stageEl = document.getElementById('stage');
  var kickerEl = document.getElementById('kicker');
  var captionEl = document.getElementById('caption');
  var capNote = captionEl.querySelector('.note');
  var capIdx = captionEl.querySelector('.idx');
  var kickNote = kickerEl.querySelector('.note');
  var progressBar = document.querySelector('#progress i');
  var debugEl = document.getElementById('debug');
  var params = P0;
  if (params.get('debug') === '1') debugEl.style.display = 'block';

  (function applyCanvas(){
    var st = document.documentElement.style;
    st.setProperty('--safe-x', rx(.05) + 'px');
    st.setProperty('--safe-top', ry(.05) + 'px');
    st.setProperty('--safe-bottom', ry(.05) + 'px');
    st.setProperty('--max-w', rx(.44) + 'px');
    [['--fs-l0',160],['--fs-l1',96],['--fs-l2',60],['--fs-l3',52],['--fs-l4',28],
     ['--fs-kicker',26],['--fs-caption',28],['--fs-idx',24]]
      .forEach(function(kv){ st.setProperty(kv[0], rFont(kv[1]) + 'px'); });
    st.setProperty('--tag-dot', rSize(9) + 'px');
    stageEl.style.width = W + 'px'; stageEl.style.height = H + 'px';
    var c1 = document.getElementById('bg'), c2 = document.getElementById('grain');
    c1.width = W; c1.height = H; c2.width = W; c2.height = H;
  })();

  /* ============================================================
     1 · 通用工具
     ============================================================ */
  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function lerp(a, b, x){ return a + (b - a) * x; }
  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
  function smoothstep(x){ x = clamp01(x); return x * x * (3 - 2 * x); }
  function fadeIn(t, at, dur){ return smoothstep((t - at) / (dur || PIECE_FADE)); }
  function fadeOut(t, at, dur){ return 1 - smoothstep((t - at) / (dur || OUT_LEAD)); }
  function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function mk(tag, cls, style){
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (style) for (var k in style) el.style[k] = style[k];
    return el;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function smk(tag, attrs){
    var el = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  /* ============================================================
     2 · 分幕网格 + 节拍表（画面 / 光影 / 音效三处只读这一张表）
     ============================================================ */
  var SCREENS = [
    { id:'s1', label:'先选立场', note:'1979 · 两组立场相反的人',        t0:0,   t1:17,  bg:{ rays:0.55, glow:0.80 } },
    { id:'s2', label:'证据选择', note:'同一份研究材料 · 正反证据混杂',    t0:17,  t1:29,  bg:{ rays:0.40, glow:0.72 } },
    { id:'s3', label:'筛选揭示', note:'LORD · ROSS · LEPPER 1979',      t0:29,  t1:54,  bg:{ rays:0.46, glow:0.80 } },
    { id:'s4', label:'命名卡',   note:'CONFIRMATION BIAS',               t0:54,  t1:71,  bg:{ rays:0.40, glow:0.72 } },
    { id:'s5', label:'机制展开', note:'筛子是谁装的',                     t0:71,  t1:86,  bg:{ rays:0.30, glow:0.62 } },
    { id:'s6', label:'生活迁移', note:'生活里的那只筛子',                  t0:86,  t1:108, bg:{ rays:0.44, glow:0.76 } },
    { id:'s7', label:'大脑处理', note:'双重标准：吸收支持 · 弹开反对',      t0:108, t1:126, bg:{ rays:0.28, glow:0.60 } },
    { id:'s8', label:'自检收束', note:'带走一个提问',                     t0:126, t1:140, bg:{ rays:0.20, glow:0.55 } }
  ];
  /* S1 先选立场（v3.5 拍板版）：
     0–2.3s 两张卡描边生长 + 卡内文字 → 2.1s 底部提问 → 2.5–6.7s 光球**两次往返**（每段 0.70s）
     → 7.5s 起停在中间偏左轻微呼吸（两侧卡片同步微弱呼吸，不再偏向任何一侧）
     → 10.5s 过渡提示入场 → 13.2s 起过渡提示与两张卡一起收缩淡出 → 15.0s 交干净画布给 S2。
     低动态窗（摆球段）从旧版的 10.2s 压到 4.2s，含停住留白共 6.0s（2.5–8.5s）。 */
  /* note 保持 2.40s（拍板表里写的是 2.0s）：2.0s 会把底部提示插到两张卡的标签（2.15s）之前，
     柔光来不及在 0.6s 内从画面底部飘到右上，A17「扫光聚焦」会挂两处（实测 648px / 805px > 光半径 640px）。
     2.40s（=旧值）是这台引擎能过的下限，只比拍板表晚 0.4 秒。 */
  var S1 = { cardL:0.20, cardR:1.20, grow:1.10, tagL:0.80, tagR:1.80, note:2.40, noteOut:9.60,
             sel0:2.50, sel1:6.70, restX:-0.30,
             bridge:10.50, bridgeOut:13.20, cardsOut:13.20, cardsDur:1.80, out:17.00 };
  /* S2 证据选择：顶部标题 → 17.4–22.4 只有「搜索环」的空画布（心理间隙）
     → 22.5s 起证据 Group 逐个弹出 → 26.2s 提示 → 28.2s 焦点框扫描 → 29.0s 进 S3 */
  var S2 = { search:17.10, title:17.20, corner:17.60, dot0:22.50, dotStep:0.43,
             note:26.20, scan0:28.20, scan1:29.00, out:29.00 };
  /* S3 筛选揭示：筛网落下 → 一组亮一组暗 → 左右分流（≤11px/s）→ 「一半」（★47.4） */
  var S3 = { sieve:29.00, sel0:33.00, dim0:35.00, dim1:38.00,
             sort0:32.80, sort1:47.00, sortSpeed:11.0,
             tagL:41.00, tagR:43.00, half:47.40, note:48.80, name:50.60, src:51.90, out:54.00 };
  /* S4 命名卡 54–71s ★重音②67.5 */
  var S4 = { matrix:54.60, tag1:56.50, tag2:58.00, frame:60.00, side:62.00,
             disc:64.50, title:67.50, sub:68.60, hook:69.30, out:71.00 };
  /* S5 机制展开：两段说明 → 四节点流程链 → 方向光带 → 两行说明 */
  var S5 = { flow:72.60, left:73.20, right:75.20, node0:77.00, nodeStep:1.40,
             note:83.30, note2:84.00, out:86.00 };
  var S6 = { main:87.50, A:92.00, B:98.00, C:103.00,
             scat0:92.00, scatStep:1.50, scatN:6, close:105.20, out:108.00 };
  var S7 = { brain:108.60, node:[109.50, 112.00, 114.50, 117.00], sum1:121.90, sum2:123.00, out:126.00 };
  var S8 = { line:126.00, title:126.90, frame:127.60, q1:129.20, side:131.60,
             ask:132.80, src:135.20, dim:138.00, out:140.00 };

  /* ============================================================
     2b · AI 底片（方案 2 混合工作流）
     只替换背景氛围层：帧序列按幕内时间循环取帧（首尾帧同图 → 无缝），
     不做 <video>（无头渲染里视频 seek 不可靠，B4 也要求按 t 取帧）。
     默认关闭：只有 ?ai=1 时才加载与显示，保证交付版本可复现。
     ============================================================ */
  var AI_PLATE = {
    S8: { id:'S8', dir:'qa/ai/frames-s8-norm/', n:151, fps:30 }
  };
  var AI_ON = params.get('ai') === '1';
  var aiLayer = document.getElementById('aiLayer');
  var AI_IMGS = {};
  (function loadAIPlate(){
    if (!AI_ON) return;
    Object.keys(AI_PLATE).forEach(function(k){
      var c = AI_PLATE[k], arr = [];
      for (var i = 1; i <= c.n; i++) {
        var im = new Image();
        im.src = c.dir + 'f' + ('000' + i).slice(-3) + '.jpg';

    { t:S4.side,  id:'soft_tick',  dB:-22, pri:1 },

    { t:S4.sub,   id:'soft_tick',  dB:-22, pri:1 },      // 英文副题
    { t:S5.flow,  id:'swish_soft', dB:-18, pri:2 },      // S5 流程链出现
    { t:S5.right, id:'soft_tick',  dB:-21, pri:1 },
    { t:S5.node0, id:'pulse_tap',  dB:-16, pri:1 },
    { t:S5.node0 + S5.nodeStep,     id:'pulse_tap', dB:-16, pri:1 },
    { t:S5.node0 + 2 * S5.nodeStep, id:'pulse_tap', dB:-16, pri:1 },
    { t:S5.node0 + 3 * S5.nodeStep, id:'pulse_tap', dB:-16, pri:1 },
    { t:S5.note,  id:'soft_tick',  dB:-22, pri:1 },
    { t:S6.main,  id:'swish_soft', dB:-18, pri:2 },      // S6 三场景
    { t:S6.A,     id:'pulse_tap',  dB:-16, pri:1 },
    { t:S6.B,     id:'pulse_tap',  dB:-16, pri:1 },
    { t:S6.C,     id:'pulse_tap',  dB:-16, pri:1 },
    { t:S6.close, id:'soft_tick',  dB:-22, pri:1 },
    { t:S7.brain, id:'swish_soft', dB:-18, pri:2 },      // S7 大脑出现
    { t:S7.node[0], id:'pulse_tap', dB:-16, pri:1 },
    { t:S7.node[1], id:'pulse_tap', dB:-16, pri:1 },
    { t:S7.node[2], id:'pulse_tap', dB:-16, pri:1 },
    { t:S7.node[3], id:'pulse_tap', dB:-16, pri:1 },
    { t:S7.sum1,  id:'soft_tick',  dB:-22, pri:1 },
    { t:S8.line,  id:'swish_soft', dB:-18, pri:2 },      // S8 粒子汇聚成线
    { t:S8.frame, id:'soft_tick',  dB:-22, pri:1 },      // 自检框弹出
    { t:S8.q1,    id:'low_impact', dB:-12, pri:3 },      // ★重音③ 收尾金句
    { t:S8.ask,   id:'soft_tick',  dB:-22, pri:1 },
    { t:S8.src,   id:'soft_tick',  dB:-22, pri:1 },
    /* v3.3 新增：幕间转场音（全部用 audio/ 里真实存在的素材，且不新增重音；
       17.1 与 29.0 已有 sub_rise / swish_soft，不重复挂 */
    { t:54.00,    id:'swish_soft', dB:-19, pri:2 },      // S3→S4：命名卡落地
    { t:71.00,    id:'swish_soft', dB:-20, pri:2 },      // S4→S5：转向机制
    { t:86.00,    id:'sub_rise',   dB:-20, pri:1 },      // S5→S6：沉到生活场景
    { t:108.00,   id:'soft_tick',  dB:-21, pri:1 }       // S6→S7：进入大脑
  ];
  /* 事件表必须按时间升序 —— 体检脚本按数组顺序算同类最小间隔，尾部追加会算出负间隔 */
  SFX_EVENTS.sort(function(a, b){ return a.t - b.t; });

  var SFX_MAX_CONCURRENT = 3;
  /* 工具链契约：audio-render.mjs（以及第一期成片）读的是事件 { t, s, g }、
     音色定义 { file, gain, minGap }。页面内部用 { id, dB } 更好读，
     这里只补齐工具链字段用于导出，不改内部逻辑。 */
  Object.keys(SFX_DEF).forEach(function(k){ SFX_DEF[k].minGap = SFX_DEF[k].min; });
  SFX_EVENTS.forEach(function(e){ e.s = e.id; e.g = e.dB; e.why = e.why || ''; });
  var SFX = { on: params.get('sfx') !== '0', ctx:null, buf:{}, el:{}, log:[], bgm:null,
              bgmVol:parseFloat(params.get('bgmvol') || '-19.2') };
  function audioEnable(){
    if (!SFX.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) SFX.ctx = new AC();
    }
    if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
    loadSfx(); loadBgm();
  }
  function loadSfx(){
    Object.keys(SFX_DEF).forEach(function(k){
      if (SFX.buf[k] || SFX.el[k]) return;
      var f = SFX_DEF[k].file;
      if (SFX.ctx) {
        fetch(f).then(function(r){ return r.arrayBuffer(); })
          .then(function(b){ return SFX.ctx.decodeAudioData(b); })
          .then(function(ab){ SFX.buf[k] = ab; })
          .catch(function(){ /* 缺素材静默降级，绝不 console.warn */ });
      } else {
        var el = new Audio(f); el.preload = 'auto'; SFX.el[k] = el;
      }
    });
  }
  function loadBgm(){
    if (!SFX.bgm && params.get('bgm') !== '0') {
      SFX.bgm = new Audio('audio/ambient_pad.mp3');
      SFX.bgm.loop = true; SFX.bgm.preload = 'auto';
      SFX.bgm.volume = Math.pow(10, SFX.bgmVol / 20);
    }
  }
  var SFX_MIN_GAP = {};
  function sfxPlay(e, clockNow){
    var def = SFX_DEF[e.id]; if (!def) return;
    /* plan = 该事件"应该"落在音频时钟上的时刻（与画面同源）；call = 真正调用的时刻。
       audio-live-check.mjs 用 (call - plan) 算触发偏差：webaudio 路径按采样级调度 → 偏差 0。 */
    var plan = clockNow + Math.max(0, e.t - curT);
    var last = SFX_MIN_GAP[e.id];
    if (last != null && clockNow - last < def.min) return;
    var live = SFX.log.filter(function(x){ return x.dur != null && clockNow - x.at < x.dur; });
    if (live.length >= SFX_MAX_CONCURRENT) {
      var lowest = live.sort(function(a, b){ return a.pri - b.pri; })[0];
      if (lowest && lowest.pri >= e.pri) return;
    }
    SFX_MIN_GAP[e.id] = clockNow;
    var dur = 0.5;
    if (SFX.buf[e.id]) {
      var g = SFX.ctx.createGain();
      g.gain.value = Math.pow(10, e.dB / 20);
      var src = SFX.ctx.createBufferSource();
      src.buffer = SFX.buf[e.id]; src.connect(g); g.connect(SFX.ctx.destination);
      src.start(plan);
      dur = SFX.buf[e.id].duration;
    } else if (SFX.el[e.id]) {
      var el2 = SFX.el[e.id];
      el2.currentTime = 0; el2.volume = Math.pow(10, e.dB / 20);
      el2.play().catch(function(){});
      dur = el2.duration || 0.5;
    }
    /* 日志同时带工具链字段（s / g）与页面内部字段（id / dB）：audio-live-check.mjs 读前者 */
    SFX.log.push({ t:e.t, s:(e.s || e.id), g:(e.g == null ? e.dB : e.g),
                   id:e.id, dB:e.dB, pri:e.pri, at:clockNow, dur:dur,
                   plan:+plan.toFixed(3), call:+clockNow.toFixed(3) });
  }
  function sfxTick(prevT, curT, live, clockNow){
    for (var i = 0; i < SFX_EVENTS.length; i++) {
      var e = SFX_EVENTS[i];
      if (e._done) continue;
      if (e.t <= curT) { e._done = true; if (live && e.t > prevT && e.t <= curT) sfxPlay(e, clockNow); }
    }
  }
  function bgmSync(){
    loadBgm();
    if (SFX.bgm && SFX.bgm.paused) SFX.bgm.play().catch(function(){});
  }

  /* ============================================================
     11 · 主渲染 + 时间循环
     ============================================================ */
  function render(t){
    var L = lightAt(t), si = screenAt(t), sc = SCREENS[si];
    if (PLATE.on) { drawBg(t, L, PLATE.dim, PLATE.boxes); drawGrain(t); return; }
    drawBg(t, L); drawGrain(t);
    updateAIPlate(t, sc);
    updateItems(t, L);
    updateOpinionCards(t); updateSelector(t); updateSearch(t); updateField(t); updateSieve(t); updateHalfRing(t);
    updateStage4(t); updateFlow(t); updateScenes(t); updateBrain(t); updateEnd(t);
    updateLeaders(t);
    for (var i = 0; i < pieceEls.length; i++) renderPiece(pieceEls[i], t, L);
    /* 幕内字幕/角标提前 0.3s 起亮：换幕时新旧两屏的字幕交叉淡化，
       不会在切点出现"两屏都还没亮"的空帧（S1→S2 这一刀正好卡在 17.0s） */
    var inFade = fadeIn(t, sc.t0 - 0.30, 0.60), outFade = fadeOut(t, sc.t1, OUT_LEAD);
    kickerEl.style.opacity = (0.9 * inFade * outFade).toFixed(3);
    captionEl.style.opacity = (0.9 * inFade * outFade).toFixed(3);
    capNote.textContent = sc.note;
    kickNote.textContent = sc.id.toUpperCase();
    capIdx.textContent = ('0' + (si + 1)).slice(-2) + ' / 0' + SCREENS.length;
    progressBar.style.width = (clamp01(t / TOTAL) * 100).toFixed(2) + '%';
    if (params.get('debug') === '1') {
      debugEl.textContent = 't=' + t.toFixed(2) + 's  screen=' + (si + 1) + '  light=(' +
        Math.round(L.x) + ',' + Math.round(L.y) + ')';
    }
  }
  function fit(){
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stageEl.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  var rate = parseFloat(params.get('rate') || '1') || 1;
  var staticFrame = !!params.get('t') || params.get('autoplay') === '0';
  var startAt = 0, curT = 0, playing = !staticFrame, t0ms = null;

  /* ---- 量测钩子：所有体检脚本都从这里取数 ---- */
  window.__seek = function(sec){ playing = false; staticFrame = true;
    curT = Math.max(0, Math.min(TOTAL, sec)); render(curT); };
  window.__state = function(){ return { t:curT, playing:playing, total:TOTAL, w:W, h:H }; };
  window.__canvas = function(){ return { w:W, h:H, aspect:+(W / H).toFixed(4), safe:SAFE,
    safeRatio:{ left:.05, right:.95, top:.05, bottom:.05 },
    scale:{ kH:kH(), rFont160:rFont(160), rSize64:rSize(64) } }; };
  window.__light = function(){ var L = lightAt(curT);
    return { t:+curT.toFixed(3), x:+L.x.toFixed(2), y:+L.y.toFixed(2), r:LIGHT_R }; };
  window.__lightKeys = function(){ return LIGHT_KEYS; };
  window.__screens = function(){ return SCREENS; };
  window.__pieces = function(){ return PIECES; };
  window.__items = function(){ var out = {}, k;
    for (k in ITEMS) if (Object.prototype.hasOwnProperty.call(ITEMS, k)) {
      var it = ITEMS[k];
      out[k] = { cx:it.cx, cy:it.cy, ev:it.ev, dx:it.dx, dy:it.dy, k:+it.k.toFixed(4),
                 out:(ITEM_SPEC[k] || {}).out, light:+it.light.toFixed(4), on:+it.on.toFixed(4) };
    }
    out.t = +curT.toFixed(3); return out; };
  window.__screenItems = function(i){ var out = [], k, ev;
    for (k in ITEMS) if (Object.prototype.hasOwnProperty.call(ITEMS, k)) {
      ev = (ITEM_SPEC[k] || {}).ev;
      if (ev != null && ev >= SCREENS[i].t0 && ev < SCREENS[i].t1) out.push(k);
    }
    return out; };
  window.__structStarts = function(i){
    var per = [ [S1.cardL, S1.cardR, S1.sel0],
    [S2.search, S2.scan0],
                [S3.sieve, S3.sel0, S3.dim0, S3.sort0, S3.half],
                [S4.matrix, S4.frame, S4.title],
                [S5.flow, S5.node0],
                [S6.main, S6.A, S6.B, S6.C],
                [S7.brain, S7.node[0], S7.node[1], S7.node[2], S7.node[3]],
                [S8.line, S8.frame, S8.q1] ];
    return i == null ? [].concat.apply([], per) : (per[i] || []);
  };
  window.__narrative = function(){
    return { t:+curT.toFixed(3),
      field:{ on:+ITEMS.field.on.toFixed(3), split:FIELD_STATE.split, select:FIELD_STATE.select,
              ignore:FIELD_STATE.ignore, focus:FIELD_STATE.focus,
              syms:EV_ELS.map(function(c){ return +(parseFloat(c.g.style.opacity) || 0).toFixed(3); }) },
      opinion:{ left:+(parseFloat(cardL.g.style.opacity) || 0).toFixed(3),
                right:+(parseFloat(cardR.g.style.opacity) || 0).toFixed(3),
                selectorDx:ITEMS.selector.dx },
      sieve:{ on:+ITEMS.sieve.on.toFixed(3), dy:ITEMS.sieve.dy },
      s4:{ divider:+(parseFloat(divider.style.opacity) || 0).toFixed(3),
           frame:+(parseFloat(frameL.style.opacity) || 0).toFixed(3),
           mask:+(parseFloat(maskR.style.opacity) || 0).toFixed(3) },
      flow:{ rails:flowRail.map(function(l){ return +(parseFloat(l.style.opacity) || 0).toFixed(3); }),
             nodes:flowNodes.map(function(f){ return +(parseFloat(f.ring.style.opacity) || 0).toFixed(3); }) },
      scenes:SCEN_ELS.map(function(s){ return +(parseFloat(s.main.style.opacity) || 0).toFixed(3); }),
      scatter:SCATTER2.map(function(s){ return +(parseFloat(s.g.style.opacity) || 0).toFixed(3); }),
      brain:{ icon:+(parseFloat(brainIcon.style.opacity) || 0).toFixed(3),
              nodes:bNodes.map(function(c){ return +(parseFloat(c.style.opacity) || 0).toFixed(3); }),
              syms:BSYM.map(function(b){ return +(parseFloat(b.g.style.opacity) || 0).toFixed(3); }) },
      end:{ qline:+(parseFloat(qlineEl.style.opacity) || 0).toFixed(3),
            frame:+(parseFloat(selfFrame.style.opacity) || 0).toFixed(3),
            syms:ESYM.map(function(e){ return +(parseFloat(e.g.style.opacity) || 0).toFixed(3); }) },
      half:ITEMS.half };
  };
  /* 本片没有球簇：通用脚本读这个钩子时返回空表（不要伪造数值） */
  window.__clusterRadii = function(){ return {}; };
  /* 本片自己的比例自证：8 个证据符号的支持/反对各多少、分流最大位移与最大速度（<12px/s） */
  window.__field = function(){
    var sup = EV_ITEMS.filter(function(d){ return d.stance === 'S'; }).length;
    return { total:EV_ITEMS.length, support:sup, oppose:EV_ITEMS.length - sup,
             maxTravel:S3.maxTravel, maxSpeed:S3.maxSpeed,
             speedRule:'分流速度上限 11px/s（硬红线 <12px/s）',
             slots:EV_ITEMS.map(function(d){ return d.kind + ':' + Math.round(d.p[0]*100) + '→' + Math.round(d.t[0]*100); }),
             phase:{ split:FIELD_STATE.split, select:FIELD_STATE.select, ignore:FIELD_STATE.ignore },
             field:{ cx:ITEMS.field.cx, cy:ITEMS.field.cy, on:+ITEMS.field.on.toFixed(4) } };
  };
  /* 元素产生动画自证：①观点卡描边 ②符号弹出 ③筛网落位 ④分流进度 ⑤「一半」光圈 */
  window.__produce = function(){
    function grew(o){ var g = +o.box.getAttribute('stroke-dashoffset') || 0; return +(1 - g / o.len).toFixed(3); }
    return {
      t: +curT.toFixed(2),
      opinion:{ left:grew(cardL), right:grew(cardR), selectorDx:ITEMS.selector.dx },
      symbols: EV_ELS.map(function(c){ return { kind:c.d.kind, stance:c.d.stance,
        op:+(parseFloat(c.g.style.opacity) || 0).toFixed(3), travel:+c.d.travel.toFixed(1),
        cx:c.d.cx, cy:c.d.cy }; }),
      sieveDy: ITEMS.sieve.dy,
      fieldPhase: FIELD_STATE,
      flow: flowNodes.map(function(f){ return +(parseFloat(f.ring.style.opacity) || 0).toFixed(3); }),
      brain: bNodes.map(function(c){ return +(parseFloat(c.style.opacity) || 0).toFixed(3); }),
      halfRing: { r:HALF_RING.rNow, op:HALF_RING.opNow, t0:HALF_RING.t0, dur:HALF_RING.dur },
      quota: { breathe:['S1 观点卡呼吸', 'S3「一半」金属字', 'S8 收尾金句'],
               pop:['S3「一半」0.60→1.00', 'S2 证据符号 0.40→1.00（8 个）'],
               note:'「一半」是重音弹入；证据符号的弹出属元素出场，不占重音配额' }
    };
  };

  window.__audioEvents = function(){ return { events:SFX_EVENTS, defs:SFX_DEF,
    maxConcurrent:SFX_MAX_CONCURRENT, sfxOn:SFX.on, bgm:SFX.bgm ? SFX.bgm.src : null, bgmVol:SFX.bgmVol }; };
  window.__audioLog = function(){ return SFX.log.slice(); };
  window.__audioStatus = function(){ var ready = [];
    Object.keys(SFX_DEF).forEach(function(k){
      ready.push(k + ':' + (SFX.buf[k] ? 'buffer' : (SFX.el[k] ? 'element' : 'missing'))); });
    return { on:SFX.on, ctx:SFX.ctx ? SFX.ctx.state : 'none', sounds:ready, played:SFX.log.length }; };
  window.__audioEnable = function(){ audioEnable(); return window.__audioStatus(); };
  /* 封面抽板入口：__plate(0.35, [[x0,y0,x1,y1],…]) —— 归一化坐标，压粒子 + 核心区不画粒子 */
  window.__plate = function(dim, boxes){
    PLATE.on = true; PLATE.dim = (dim == null ? 0.35 : dim); PLATE.boxes = boxes || null;
    /* 早退只停了"这一帧的绘制"，上一帧画在 DOM 上的母题与文字还留着 —— 必须显式藏掉，
       否则抽出来的背景板会把成片的文字和飞机一起截进去（实测踩过） */
    textsRoot.style.display = 'none';
    itemsSvg.style.display = 'none';
    kickerEl.style.display = 'none';
    captionEl.style.display = 'none';
    document.getElementById('progress').style.display = 'none';
    render(curT);
    return { on:PLATE.on, dim:PLATE.dim, boxes:PLATE.boxes, t:curT };
  };

  var lastFrameT = -1;
  function loop(now){
    var prevT = lastFrameT;
    if (playing) {
      if (t0ms === null) t0ms = now - curT * 1000 / rate;
      curT = (now - t0ms) / 1000 * rate;
      if (curT >= TOTAL) { curT = TOTAL; playing = false; }
    }
    var clockNow = SFX.ctx ? SFX.ctx.currentTime : now / 1000;
    render(curT);
    var live = playing && !staticFrame;
    sfxTick(prevT, curT, live, clockNow);
    if (live) bgmSync();
    lastFrameT = curT;
    requestAnimationFrame(loop);
  }
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space') { e.preventDefault();
      if (playing) playing = false; else { playing = true; t0ms = null; audioEnable(); } }
    else if (e.key === 'r' || e.key === 'R') { curT = startAt; t0ms = null; playing = true; staticFrame = false; }
  });
  window.addEventListener('pointerdown', function(){ if (SFX.on) audioEnable(); }, { once:true });
  if (params.get('sfx') === '1') audioEnable();

  if (staticFrame) {
    curT = Math.max(0, Math.min(TOTAL, parseFloat(params.get('t')) || 0));
    playing = false; render(curT);
  }
  fit();
  requestAnimationFrame(loop);
})();
</script>
</body>

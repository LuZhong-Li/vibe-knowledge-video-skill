<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>控制错觉 · v3.5 全片（七屏 / 150s / 无配音）</title>
<!--
  ============================================================
  控制错觉 v3.2 · 单文件知识短片（1080×1920 / 150.000s / 无配音无字幕）

  设计规范：v2/00-设计文档.md（v2.3）
  执行方案：v2/01-执行方案.md

  七屏：0–9 钩子 / 9–26 爆点 / 26–48 对比 / 48–62 数据 /
        62–90 三案例 / 90–120 机制 / 120–150 金句

  v3.5「附着层」增量（在 v3.3 的 16:9 版面上，只改 S2 一处：信息层级重构）：
    ④ 附着层：Item 主角物品 + AttachmentLabel 附着标签 + ScatteredNote 分散注释 + LightLink 扫光联动
       —— 原来画面底部那一整段斜排正文，拆成 3 条短注释散落在圆环周边；
          标签紧贴物品、跟随物品微动、随物品明暗（文字不再自成一层）。
  前序（v3.2/v3.3，保留不动）：
    ② 光影层：一束金棕柔光全片漫游（drawSweep），金属字高光随光源滑动
    ③ 图形层：S2 圆环描边生长 / 环绕文字逐字生长 / 金球聚拢 / 灰球弥散
    ① 时序层：stagger 递进（图形先动，文字跟随图形事件逐场出现）
  复用开关：UPGRADED = { 1:true }，S2 过审后把 S3–S7 依次置 true 即可

  P0 硬约束（§4.7）：
    ① 字号与坐标全部 1080×1920 绝对 px，禁用 vw/vh/clamp
    ② 外层位移 / 内层缩放分离 transform
    ③ 所有状态由 t 计算（?t= 可定位任意一帧，逐帧出片依赖此点）
    ④ 大字 0.04em / 小字 0.08em 字距
    ⑤ background-clip:text 的元素禁用 text-shadow（会压暗金属字）
    ⑥ 文字位移取整像素（避免发虚与码率浪费）

  调试：?t=45 定位　?debug=1 时间码　?rate=0.5 半速
  ============================================================
-->
<style>
  :root{
    --bg-deep:#0A0A0A; --bg-char:#141210;
    --ink:#F5F1E8; --ink-2:rgba(245,241,232,.62); --ink-3:rgba(245,241,232,.30);
    --gold-hi:#D7B979; --gold:#B8944A; --gold-line:#8A7655; --glow:#6B4A1A;
    /* 下面这组数值由 JS 按 CANVAS 尺寸重算（此处为 1920×1080 基准值） */
    --safe-x:96px; --safe-top:54px; --safe-bottom:54px;
    --max-w:845px; --fs-l0:160px; --fs-l1:96px; --fs-l2:60px; --fs-l3:52px; --fs-l4:28px;
    --fs-lead:52px; --fs-kicker:26px; --fs-caption:28px; --fs-idx:24px;
    --fs-vs:34px; --fs-scale:26px; --grid-cell:64px; --grid-gap:32px; --tag-dot:9px;
    --line:1.5px;
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun","Times New Roman",serif;
    --kai:"KaiTi","STKaiti","Kaiti SC","Songti SC","SimSun",serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; background:#000; overflow:hidden; cursor:none;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #viewport{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #stage{
    position:absolute; left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin:center center; transform:translate(-50%,-50%) scale(1);
    overflow:hidden;
    background:
      radial-gradient(120% 70% at 74% 32%, #1A1510 0%, rgba(20,18,16,0) 58%),
      linear-gradient(180deg,#0E0D0C 0%,#0A0A0A 55%,#060606 100%);
  }
  #bg,#grain{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }
  #grain{ mix-blend-mode:overlay; opacity:.5; z-index:1; }
  #vignette{
    position:absolute; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(72% 52% at 50% 44%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 76%, rgba(0,0,0,.46) 100%);
  }
  .layer{ position:absolute; inset:0; }
  #structures{ z-index:3; }
  #texts{ z-index:4; }
  #balls{ z-index:6; }
  #kicker{
    position:absolute; top:var(--safe-top); left:var(--safe-x); right:var(--safe-x);
    display:flex; justify-content:space-between; align-items:baseline; z-index:7;
    font-family:var(--serif); font-size:var(--fs-kicker); letter-spacing:.30em;
    color:var(--ink-3); opacity:0;
  }
  #kicker span:last-child{ letter-spacing:.22em; }
  #caption{
    position:absolute; left:var(--safe-x); right:var(--safe-x); bottom:var(--safe-bottom);
    display:flex; justify-content:space-between; align-items:flex-end; z-index:7;
    font-family:var(--serif); font-size:var(--fs-caption); letter-spacing:.10em;
    color:var(--ink-3); opacity:0;
  }
  #caption .idx{ font-size:var(--fs-idx); letter-spacing:.24em; }
  #progress{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.05); z-index:7; }
  #progress i{ display:block; height:100%; width:0%;
    background:linear-gradient(90deg, rgba(184,148,74,.42), rgba(184,148,74,.10)); }
  /* ---------- 文本分片 ---------- */
  .piece{
    position:absolute; font-family:var(--serif); color:var(--ink);
    opacity:0; white-space:normal; max-width:var(--max-w);
    will-change:transform,opacity,filter;
  }
  .piece.nowrap{ white-space:nowrap; }
  /* v3 文字图形化：竖排 / 斜排 / 标签 / 路径文字 */
  .piece.vert{ writing-mode:vertical-rl; text-orientation:upright; }
  .piece.kai{ font-family:var(--kai); letter-spacing:.14em; }
  .piece.tag{ display:flex; align-items:center; gap:16px; color:rgba(245,241,232,.78); }
  .piece.tag i{
    flex:0 0 auto; width:var(--tag-dot); height:var(--tag-dot); border-radius:50%;
    background:rgba(215,185,121,.75);
  }
  /* 注意：.ringtext 必须是定位元素，否则内部逐字 span 会相对 #structures 左上角定位，
     整圈文字会被推到画外（v3.1–v3.2 的真实 bug，v3.3 修正） */
  .ringtext{ position:absolute; width:0; height:0; }
  .ringtext span{
    position:absolute; left:0; top:0; transform-origin:50% 50%;
    font-family:var(--serif); white-space:nowrap; line-height:1.05;
  }
  .lv-l0{ font-size:var(--fs-l0); line-height:1.10; font-weight:600; letter-spacing:.02em; }
  .lv-l1{ font-size:var(--fs-l1); line-height:1.40; font-weight:600; letter-spacing:.04em; }
  .lv-l2{ font-size:var(--fs-l2); line-height:1.55; font-weight:500; letter-spacing:.05em; }
  .lv-l3{ font-size:var(--fs-l3); line-height:1.75; font-weight:400; letter-spacing:.08em; color:var(--ink-2); }
  .lv-l4{ font-size:var(--fs-l4); line-height:1.60; font-weight:400; letter-spacing:.08em; color:var(--ink-3); }
  .lv-lead{ font-size:var(--fs-lead); line-height:1.60; font-weight:400; letter-spacing:.16em; color:var(--ink-2); }
  /* 金属渐变字：v3.2 起高光随光源滑动（background-position 由 t 驱动），
     底图取 200% 高、内含 3 条高光带，任何时刻字面上都有一条亮带，
     窗口上下平移 → 高光慢慢滑过字形，而不是一张固定贴图。 */
  .metal{
    background-image:linear-gradient(174deg,
      #F2E0B4 0%, #F8EAC6 6%, #FFFBE9 14%, #F6E4B8 22%, #EFDCAF 30%,
      #F6E7C0 38%, #FFFDF0 50%, #F6E4B8 58%, #EFDCAF 66%,
      #F6E7C0 74%, #FFFBE9 85%, #F6E4B8 93%, #F2E0B4 100%);
    background-size:100% 200%; background-repeat:no-repeat; background-position:0% 50%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:.6px rgba(74,48,12,.28);
  }
  /* ---------- v3.2 叙述性图形（S2 原型） ---------- */
  #ringS2{ position:absolute; left:0; top:0; z-index:3; opacity:0; }
  #ringS2 circle{ fill:none; }
  #ringS2 .ring-line{ stroke:rgba(138,118,85,.60); stroke-linecap:round; }
  #ringS2 .ring-inner{ stroke:rgba(184,148,74,.16); stroke-dasharray:5 11; }
  .ring-dot{
    position:absolute; border-radius:50%; will-change:transform,opacity;
    background:radial-gradient(circle at 36% 32%, rgba(245,235,210,.95), rgba(215,185,121,.85) 46%, rgba(184,148,74,.55) 100%);
    box-shadow:0 0 22px rgba(215,185,121,.45);
  }
  .mball{ position:absolute; border-radius:50%; will-change:transform,opacity; }
  .mball-gold{
    border:1.5px solid rgba(184,148,74,.72);
    background:radial-gradient(circle at 34% 30%, rgba(215,185,121,.18), rgba(184,148,74,0) 64%);
  }
  .mball-gray{
    border:1.5px solid rgba(245,241,232,.24);
    background:radial-gradient(circle at 34% 30%, rgba(245,241,232,.06), rgba(245,241,232,0) 64%);
  }
  .mball-gold::after, .mball-gray::after{
    content:''; position:absolute; inset:14%; border-radius:50%;
    border:1.2px solid transparent;
  }
  .mball-gold::after{ border-top-color:rgba(215,185,121,.45); transform:rotate(-32deg); }
  .mball-gray::after{ border-top-color:rgba(245,241,232,.18); transform:rotate(26deg); }
  /* ---------- 母题：号码球 ---------- */
  .ball{ position:absolute; border-radius:50%; }
  .ball::after{ content:''; position:absolute; inset:12%; border-radius:50%; border:1.5px solid transparent; }
  .ball .num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:600; letter-spacing:0; color:rgba(245,241,232,.62);
  }
  .ball-gold{
    border:1.5px solid rgba(184,148,74,.62);
    background:radial-gradient(circle at 34% 30%, rgba(215,185,121,.10), rgba(184,148,74,0) 62%);
    box-shadow:0 0 90px rgba(107,74,26,.30);
  }
  .ball-gold::after{ border-top-color:rgba(215,185,121,.40); transform:rotate(-34deg); }
  .ball-white{
    border:1.5px solid rgba(245,241,232,.22);
    background:radial-gradient(circle at 34% 30%, rgba(245,241,232,.07), rgba(245,241,232,0) 62%);
  }
  .ball-white::after{ border-top-color:rgba(245,241,232,.16); transform:rotate(28deg); }
  /* ---------- 结构件：球阵列 / 概率刻度 / 数据框 / 图标 / 大脑 ---------- */
  .grid3{ position:absolute; display:grid; grid-template-columns:repeat(3,var(--grid-cell)); gap:var(--grid-gap); }
  .grid3 .cell{ width:var(--grid-cell); height:var(--grid-cell); border-radius:50%; border:1.5px solid rgba(245,241,232,.26); }
  .grid3 .cell.gold{
    border-color:rgba(215,185,121,.85);
    background:radial-gradient(circle at 34% 30%, rgba(215,185,121,.55), rgba(184,148,74,.30) 62%, rgba(184,148,74,.12) 100%);
  }
  .divider{ position:absolute; width:1px; background:rgba(245,241,232,.14); }
  .vs{ position:absolute; font-family:var(--serif); font-size:var(--fs-vs); letter-spacing:.16em; color:var(--ink-3); }
  .scale{ position:absolute; height:1px; background:rgba(138,118,85,.55); }
  .scale-tick{ position:absolute; width:1px; height:8px; background:rgba(138,118,85,.42); }
  .scale-cursor{ position:absolute; width:9px; height:9px; border-radius:50%; background:rgba(215,185,121,.75); }
  .scale-label{ position:absolute; font-family:var(--serif); font-size:var(--fs-scale); letter-spacing:.10em; color:var(--ink-3); }
  .frame{ position:absolute; border:1px solid rgba(184,148,74,.42); }
  .icon{ position:absolute; }
  .icon .stroke{ fill:none; stroke:rgba(245,241,232,.42); stroke-width:1.5; }
  .icon .gold{ fill:rgba(215,185,121,.55); stroke:rgba(215,185,121,.75); stroke-width:1.2; }
  /* ---------- v4 主角物品：价格气泡 / 对比柱 / 对比线 / 大脑轮廓 / 汇聚粒子 / 金球「7」 ---------- */
  .bubble{ position:absolute; border-radius:50%; }
  .bubble-gold{
    border:1.5px solid rgba(215,185,121,.78);
    background:radial-gradient(circle at 36% 32%, rgba(215,185,121,.20), rgba(184,148,74,.04) 70%, rgba(184,148,74,0) 100%);
    box-shadow:0 0 60px rgba(107,74,26,.30);
  }
  .bubble-gray{
    border:1.5px solid rgba(245,241,232,.30);
    background:radial-gradient(circle at 36% 32%, rgba(245,241,232,.07), rgba(245,241,232,0) 70%);
  }
  .vbar{ position:absolute; border-radius:2px; }
  .vbar-gold{ background:linear-gradient(180deg, rgba(215,185,121,.85), rgba(184,148,74,.16)); box-shadow:0 0 40px rgba(107,74,26,.28); }
  .vbar-gray{ background:linear-gradient(180deg, rgba(245,241,232,.34), rgba(245,241,232,.08)); }
  .hline{ position:absolute; height:1.5px;
    background:linear-gradient(90deg, rgba(138,118,85,0), rgba(215,185,121,.80), rgba(138,118,85,0)); }
  .vaxis{ position:absolute; border-radius:2px;
    background:linear-gradient(180deg, rgba(138,118,85,0), rgba(215,185,121,.55) 30%, rgba(215,185,121,.80)); }
  .b7ghost{ position:absolute; opacity:0; filter:blur(1.5px); }
  .b7ghost svg{ display:block; overflow:visible; }
  .b7ghost .b7ring{ fill:rgba(215,185,121,.02); stroke:rgba(215,185,121,.34); stroke-width:1.6; }
  .b7ghost .b7hot{ fill:none; stroke:rgba(255,251,233,.18); stroke-width:2.2; stroke-linecap:round; }
  .b7ghost .b7num{
    fill:rgba(245,241,232,.34); font-family:var(--serif); font-size:96px; font-weight:600;
    text-anchor:middle; dominant-baseline:central;
  }
  .quoteline{ position:absolute; height:1.5px;
    background:linear-gradient(90deg, rgba(184,148,74,0), rgba(215,185,121,.85), rgba(184,148,74,0)); }
  .brainWrap{ position:absolute; z-index:2; }
  .brainWrap svg{ display:block; }
  .brainWrap path{ fill:none; stroke:rgba(245,241,232,.50); stroke-width:1.4; stroke-linecap:round; }
  .brainDot{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 36% 32%, rgba(245,235,210,.95), rgba(215,185,121,.85) 46%, rgba(184,148,74,.45) 100%);
    box-shadow:0 0 26px rgba(215,185,121,.50);
  }
  .pnote{ position:absolute; border-radius:50%; background:rgba(215,185,121,.90); box-shadow:0 0 10px rgba(215,185,121,.55); }
  .b7 svg{ display:block; overflow:visible; }
  .b7 .b7ring{ fill:rgba(215,185,121,.035); stroke:rgba(215,185,121,.72); stroke-width:1.6; }
  .b7 .b7hot{ fill:none; stroke:rgba(255,251,233,.50); stroke-width:2.2; stroke-linecap:round; }
  .b7 .b7num{
    fill:rgba(245,241,232,.86); font-family:var(--serif); font-size:96px; font-weight:600;
    text-anchor:middle; dominant-baseline:central;
  }
  .icon .kline{ stroke:rgba(245,241,232,.55); }
  #debug{
    position:absolute; right:24px; bottom:20px; display:none; z-index:9;
    font:12px/1 ui-monospace,Consolas,monospace; color:rgba(255,255,255,.45);
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="bg" width="1920" height="1080"></canvas>
    <canvas id="grain" width="1920" height="1080"></canvas>
    <div id="vignette"></div>
    <div class="layer" id="structures"></div>
    <div class="layer" id="texts"></div>
    <div class="layer" id="balls"></div>
    <div id="kicker"><span>VIBE 知识大赏</span><span>控制错觉</span></div>
    <div id="caption"><span class="note"></span><span class="idx"></span></div>
    <div id="progress"><i></i></div>
    <div id="debug"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  /* ============================================================
     v3.3 · 16:9 画幅（§7 画幅规范）
     ------------------------------------------------------------
     画布基准 1920×1080；所有位置用相对坐标 rx()/ry()，所有尺寸用 rFont()/rSize()；
     安全框 0.05–0.95（抖音 1080p：左右 96 / 上 54 / 下 1026）；
     切分辨率只改 CANVAS.w/h（或用 ?cw=2560&ch=1440 直接出 2K），版面与动画常量不动。
     ============================================================ */
  var params0 = new URLSearchParams(location.search);
  var CANVAS = { w: parseFloat(params0.get('cw') || '1920'), h: parseFloat(params0.get('ch') || '1080') };
  if (!isFinite(CANVAS.w) || CANVAS.w < 640) CANVAS.w = 1920;
  if (!isFinite(CANVAS.h) || CANVAS.h < 360) CANVAS.h = 1080;
  var W = CANVAS.w, H = CANVAS.h, TOTAL = 128;
  function rx(r) { return Math.round(r * W); }          // 相对横坐标 → 像素
  function ry(r) { return Math.round(r * H); }          // 相对纵坐标 → 像素
  function kH() { return H / 1080; }                    // 高度基准缩放（1080p = 1）
  /* 字号 / 尺寸不取整：取整会让 2K 下相对尺寸偏差 ~1%（字体度量按整数像素算） */
  function rFont(px) { return Math.round(px * kH() * 1000) / 1000; }  // 字号
  function rSize(px) { return Math.round(px * kH() * 1000) / 1000; }  // 图形尺寸 / 线宽 / 半径
  var SAFE = { left: rx(0.05), right: rx(0.95), top: ry(0.05), bottom: ry(0.95) };
  var STAGE_IN = 0.80, PIECE_FADE = 0.85, FLOAT_PERIOD = 14, BREATHE_PERIOD = 6.0;
  var OUT_LEAD = 0.90;          // 换页：上一屏提前 0.9s 开始淡出

  var textsRoot = document.getElementById('texts');
  var structRoot = document.getElementById('structures');
  var ballsRoot = document.getElementById('balls');
  var stageEl = document.getElementById('stage');
  var kickerEl = document.getElementById('kicker');
  var captionEl = document.getElementById('caption');
  var capNote = captionEl.querySelector('.note');
  var capIdx = captionEl.querySelector('.idx');
  var progressBar = document.querySelector('#progress i');
  var debugEl = document.getElementById('debug');
  var params = params0;
  if (params.get('debug') === '1') debugEl.style.display = 'block';

  /* 画布 / 字号一次性按 CANVAS 换算：切 2K 只改 CANVAS.w/h（或 ?cw=2560&ch=1440），版面与动画常量不动 */
  (function applyCanvas() {
    var st = document.documentElement.style;
    st.setProperty('--safe-x', rx(0.05) + 'px');
    st.setProperty('--safe-top', ry(0.05) + 'px');
    st.setProperty('--safe-bottom', ry(0.05) + 'px');
    st.setProperty('--max-w', rx(0.44) + 'px');
    [['--fs-l0', 160], ['--fs-l1', 96], ['--fs-l2', 60], ['--fs-l3', 52], ['--fs-l4', 28],
     ['--fs-lead', 52], ['--fs-kicker', 26], ['--fs-caption', 28], ['--fs-idx', 24],
     ['--fs-vs', 34], ['--fs-scale', 26]]
      .forEach(function (kv) { st.setProperty(kv[0], rFont(kv[1]) + 'px'); });
    st.setProperty('--grid-cell', rSize(64) + 'px');
    st.setProperty('--grid-gap', rSize(32) + 'px');
    st.setProperty('--tag-dot', rSize(9) + 'px');
    stageEl.style.width = W + 'px';
    stageEl.style.height = H + 'px';
    var c1 = document.getElementById('bg'), c2 = document.getElementById('grain');
    c1.width = W; c1.height = H; c2.width = W; c2.height = H;
  })();

  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
  function smoothstep(x){ x = clamp01(x); return x * x * (3 - 2 * x); }
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ============================================================
     一·五 · 附着层（v4）· 物品主体 + 文字跟随互动
     ------------------------------------------------------------
     规则（设计文档 §5.5 / v4 重设计方案 §0.2）：图形是演员，文字是贴在演员身上的标签。
       ① 每屏先定义主角物品（Item），物品先动，文字后到；
       ② 解释句不再排成一个大文本块，拆成短注释（ScatteredNote）散在物品周边；
       ③ 标签 / 注释与物品共用一条时间线：物品位移、缩放、明暗，标签逐帧跟随；
       ④ 扫光扫到物品，贴在它身上的文字一起亮；物品沉入暗部，文字一起压暗。

      el.style.top = (it.cy + it.dy) + 'px';
      el.style.transform = 'translate(-50%,-50%) scale(' + (dpu * (0.7 + 0.3 * act)).toFixed(3) + ')';
      el.style.opacity = (it.on * vis * dec * (0.30 + 0.70 * lfOf(it.cx + it.dx, it.cy + it.dy))).toFixed(3);
    } else if (k === 'converge') {
      /* 四角粒子向心汇聚 → 在金句下方汇成水平线（散沙归拢） */
      for (i = 0; i < rec.els.length; i++) {
        B = rec.els[i];
        var cp = easeOutCubic(clamp01((t - rec.start - B.d * 0.9) / (rec.dur || 2.6)));
        var px2 = (B.x0 + (B.x1 - B.x0) * cp) * W, py2 = (B.y0 + (B.y1 - B.y0) * cp) * H;
        el = B.el;
        el.style.transform = 'translate(' + Math.round(px2 - rSize(3)) + 'px,' + Math.round(py2 - rSize(3)) + 'px)';
        el.style.opacity = (vis * (0.06 + 0.30 * Math.sin(Math.min(1, cp * 1.6) * Math.PI)) *
                            (0.60 + 0.40 * Math.sin(t * 1.7 + B.ph)) * dec).toFixed(3);
      }
    } else if (k === 'ballGrow') {
      /* S1 金球：轮廓 1.2s 生长 → 数字「7」写入 → 漂浮呼吸（位置/缩放由 ITEMS.ball7 驱动） */
      it = ITEMS.ball7;
      var gp2 = easeOutCubic(clamp01((t - rec.start) / rec.dur));
      rec.ring.style.strokeDashoffset = (rec.rlen * (1 - gp2)).toFixed(1);
      var nIn = smoothstep((t - rec.digit) / 0.9);
      rec.num.style.opacity = nIn.toFixed(3);
      rec.num.style.transformOrigin = '100px 100px';
      rec.num.style.transform = 'scale(' + (0.82 + 0.18 * nIn).toFixed(3) + ')';
      el.style.transform = 'translate(' + it.dx + 'px,' + it.dy + 'px) scale(' + it.k.toFixed(4) + ')';
      el.style.opacity = (it.on * vis * dec).toFixed(3);
    } else if (k === 'spark') {
      /* 球周围偶尔飘出的金色微粒子：向外扩散后消散 */
      it = ITEMS.ball7;
      for (i = 0; i < rec.els.length; i++) {
        B = rec.els[i];
        var cyc = 4.2, sp2 = ((t - rec.start - B.ph * 0.9) % cyc + cyc) % cyc / cyc;
        var rr2 = B.r + sp2 * rSize(64);
        var aa2 = B.a + t * 0.42;
        var qx = it.cx + it.dx + Math.cos(aa2) * rr2, qy = it.cy + it.dy + Math.sin(aa2) * rr2 * 0.92;
        B.el.style.transform = 'translate(' + Math.round(qx - rSize(4.5)) + 'px,' + Math.round(qy - rSize(4.5)) + 'px)';
        B.el.style.opacity = (it.on * vis * 0.42 * Math.sin(sp2 * Math.PI)).toFixed(3);
      }
    }
  }

  var capState = { i:-1 };
  function render(t){
    var L = lightAt(t);
    updateItems(t, L);          // ④ 附着层：先把物品这一帧的位置 / 缩放 / 光照算出来，文字再跟着走
    var cfg = { rays:0, curve:0, glow:0, sweep:1.0, motes:0, ambient:1, light:L };
    var upg = 0;
    for (var i = 0; i < SCREENS.length; i++) {
      var vis = screenVis(i, t);
      var w = (i === SCREENS.length - 1) ? Math.max(vis, t >= 149.9 ? 1 : 0) : vis;
      if (w > 0) {
        cfg.rays += SCREENS[i].bg.rays * w;
        cfg.curve += SCREENS[i].bg.curve * w;
        cfg.glow += SCREENS[i].bg.glow * w;
        if (UPGRADED[i]) upg = Math.max(upg, w);
      }
      var on = UPGRADED[i] ? 1 : 0;
      for (var a = 0; a < screenTextNodes[i].length; a++) renderPiece(screenTextNodes[i][a], t, vis, L, on);
      for (var b = 0; b < screenNodes[i].structs.length; b++) renderStruct(screenNodes[i].structs[b], t, vis, L);
    }
    /* 叙述改造屏：全屏粒子让位给图形局部粒子（不铺满全屏） */
    cfg.motes = upg;
    cfg.ambient = 1 - 0.62 * upg;
    drawBackground(t, cfg);
    drawGrain(t);

    kickerEl.style.opacity = (0.95 * smoothstep((t - 0.5) / 1.6)).toFixed(3);
    var cur = 0;
    for (var c = 0; c < SCREENS.length; c++) if (t >= SCREENS[c].t0) cur = c;
    if (t >= TOTAL) cur = SCREENS.length - 1;
    if (capState.i !== cur) {
      capNote.textContent = SCREENS[cur].note;
      capIdx.textContent = ('0' + (cur + 1)).slice(-2) + ' / 0' + SCREENS.length;
      capState.i = cur;
    }
    captionEl.style.opacity = (Math.max(screenVis(cur, t), t >= TOTAL - 0.01 ? 1 : 0) * 0.95).toFixed(3);
    progressBar.style.width = (clamp01(t / TOTAL) * 100).toFixed(3) + '%';
    /* S7 收尾：最后 5s 整屏亮度缓慢下降（文字不淡出，靠整屏压暗做结尾呼吸感） */
    var dimF = 1 - 0.20 * smoothstep((t - S7_T.dim) / Math.max(0.001, TOTAL - S7_T.dim));
    stageEl.style.filter = dimF > 0.999 ? '' : 'brightness(' + dimF.toFixed(4) + ')';
    if (debugEl.style.display === 'block') {
      var s2 = SCREENS[cur];
      debugEl.textContent = s2.label + '  t=' + t.toFixed(2) + 's / ' + TOTAL + 's';
    }
  }

  /* ============================================================
     五 · 播放控制
     ============================================================ */
  var staticFrame = params.get('t') !== null && params.get('t') !== '';
  var rate = parseFloat(params.get('rate') || '1');
  if (!isFinite(rate) || rate <= 0) rate = 1;
  /* ?start=9 从第 9 秒开始播（便于只看某一屏；不影响任何时序常量） */
  var startAt = parseFloat(params.get('start') || '0');
  if (!isFinite(startAt) || startAt < 0) startAt = 0;
  startAt = Math.min(startAt, TOTAL);
  var curT = startAt, playing = !staticFrame, t0ms = null;
  window.__seek = function (sec) {
    playing = false; staticFrame = true;
    curT = Math.max(0, Math.min(TOTAL, sec));
    render(curT);
  };
  window.__state = function () { return { t: curT, playing: playing, total: TOTAL, w: W, h: H }; };
  /* 画幅量测钩子：所有体检脚本都从这里取画布与安全框，切 16:9 / 2K 不用改脚本 */
  window.__canvas = function () {
    return { w: W, h: H, aspect: +(W / H).toFixed(4), safe: SAFE,
             safeRatio: { left: 0.05, right: 0.95, top: 0.05, bottom: 0.05 },
             scale: { kH: kH(), rFont160: rFont(160), rSize64: rSize(64) } };
  };
  /* v3.2 叙述层量测钩子（供 tools/narrative.mjs 验收：光源位置 / 环生长 / 球簇状态） */
  window.__light = function () {
    var L = lightAt(curT);
    /* 返回未取整的坐标：验收脚本要算「漫游速度」，取整会把 1px/0.1s 的缓慢移动抹成 0 */
    return { t: +curT.toFixed(3), x: +L.x.toFixed(2), y: +L.y.toFixed(2), r: LIGHT_R };
  };
  /* 音效层量测钩子（供 tools/audio-render.mjs 离线混音与 §6.3 验收） */
  window.__audioEvents = function () { return { screen: 2, events: SFX_EVENTS, defs: SFX_DEF,
    maxConcurrent: SFX_MAX_CONCURRENT, sfxOn: SFX.on, bgm: SFX.bgm ? SFX.bgm.src : null,
    bgmVol: parseFloat(params.get('bgmvol') || '-18') }; };
  window.__audioLog = function () { return SFX.log.slice(); };
  window.__audioStatus = function () {
    var ready = [];
    for (var k in SFX_DEF) if (Object.prototype.hasOwnProperty.call(SFX_DEF, k)) {
      ready.push(k + ':' + (SFX.buf[k] ? 'buffer' : (SFX.el[k] ? 'element' : 'missing')));
    }
    return { on: SFX.on, ctx: SFX.ctx ? SFX.ctx.state : 'none', sounds: ready, played: SFX.log.length };
  };
  window.__audioEnable = function () { audioEnable(); return window.__audioStatus(); };
  window.__narrative = function () {
    var svg = document.getElementById('ringS2');
    var dots = [].map.call(document.querySelectorAll('.ring-dot'), function (d) { return +d.style.opacity || 0; });
    var chars = [].map.call(document.querySelectorAll('.ringtext span'), function (s) { return +s.style.opacity || 0; });
    return {
      t: +curT.toFixed(3),
      ring: { op: +(svg ? svg.style.opacity : 0) || 0,
              dash: svg ? parseFloat(svg.querySelector('.ring-line').getAttribute('stroke-dashoffset')) : -1,
              circ: RING_S2_C, r: RING_S2.r,
              width: svg ? parseFloat(svg.querySelector('.ring-line').getAttribute('stroke-width')) : 0,
              hot: svg ? svg.querySelector('.ring-hot').getAttribute('stroke') : '' },
      dots: dots, chars: chars,
      balls: [].map.call(document.querySelectorAll('.mball'), function (b) {
        return { tf: b.style.transform, op: +b.style.opacity || 0, gold: b.classList.contains('mball-gold') };
      }),
      gold: ITEMS.gold, gray: ITEMS.gray, lclu: ITEMS.lclu, rclu: ITEMS.rclu
    };
  };
  window.__pieces = function () { return PIECES; };
  window.__screens = function () { return SCREENS; };
  /* 球簇量测：每个物品名下所有球到「物品中心」的平均半径（球与贴球标签共用同一份数据） */
  window.__clusterRadii = function () {
    var out = {}, k;
    for (k in ITEMS) if (Object.prototype.hasOwnProperty.call(ITEMS, k)) {
      var els = document.querySelectorAll('.mball[data-item="' + k + '"]');
      if (!els.length) continue;
      var it = ITEMS[k], sum = 0, cnt = 0;
      for (var i = 0; i < els.length; i++) {
        var m = /translate\((-?[\d.]+)px,\s*(-?[\d.]+)px\)/.exec(els[i].style.transform || '');
        if (!m) continue;
        var bx = +m[1] + els[i].offsetWidth / 2, by = +m[2] + els[i].offsetHeight / 2;
        sum += Math.sqrt(Math.pow(bx - (it.cx + it.dx), 2) + Math.pow(by - (it.cy + it.dy), 2));
        cnt++;
      }
      if (cnt) out[k] = +(sum / cnt).toFixed(1);
    }
    return out;
  };
  /* 该屏的主角物品清单（v4：按节拍表的出场时刻归属到屏） */
  window.__screenItems = function (i) {
    var out = [], k, ev;
    for (k in ITEMS) if (Object.prototype.hasOwnProperty.call(ITEMS, k)) {
      ev = (ITEM_SPEC[k] || {}).ev;
      if (ev != null && ev >= SCREENS[i].t0 && ev < SCREENS[i].t1) out.push(k);
    }
    return out;
  };
  /* 该屏所有图形件的起始时刻（图形先行以「最早的图形动作」为准，不只是物品） */
  window.__structStarts = function (i) {
    return screenNodes[i].structs
      .map(function (r) { return (r.start == null ? null : r.start); })
      .filter(function (v) { return v != null; });
  };
  /* ④ 附着层量测钩子（供 tools/attach-check.mjs 验收：主角物品状态 / 附着标签跟随与明暗） */
  window.__items = function () {
    var out = {}, k;
    for (k in ITEMS) if (Object.prototype.hasOwnProperty.call(ITEMS, k)) {
      var it = ITEMS[k];
      out[k] = { cx:it.cx, cy:it.cy, ev:it.ev, dx:it.dx, dy:it.dy, k:+it.k.toFixed(4),
                 out:(ITEM_SPEC[k] || {}).out, light:+it.light.toFixed(4), on:+it.on.toFixed(4) };
    }
    out.t = +curT.toFixed(3);
    return out;
  };
  var lastFrameT = -1;
  function loop(now) {
    var prevT = lastFrameT;
    if (playing) {
      if (t0ms === null) t0ms = now - curT * 1000 / rate;
      curT = (now - t0ms) / 1000 * rate;
      if (curT >= TOTAL) { curT = TOTAL; playing = false; }
    }
    /* 时钟锚必须在渲染之前取：画面时间 curT 来自 rAF 时间戳 now，
       与它同一瞬间的音频时钟配对，才不会有"渲染耗时"带来的系统偏移 */
    var clockNow = SFX.ctx ? SFX.ctx.currentTime : now / 1000;
    render(curT);
    /* §6：只在真实播放时发声；跳转 / 回退 / 静态帧一律不触发 */
    var live = playing && !staticFrame;
    sfxTick(prevT, curT, live, clockNow);
    if (live) bgmSync(curT);
    lastFrameT = curT;
    requestAnimationFrame(loop);
  }
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stageEl.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (playing) playing = false;
      else { playing = true; t0ms = null; }
    } else if (e.key === 'r' || e.key === 'R') {
      curT = startAt; t0ms = null; playing = true; staticFrame = false;
      SFX.resync = true;
    }
  });
  if (staticFrame) {
    curT = Math.max(0, Math.min(TOTAL, parseFloat(params.get('t')) || 0));
    playing = false;
    render(curT);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
